[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-querywatch"
version = "0.1.0"
description = "Automated database-performance analysis for Django."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "QueryWatch contributors" }]
keywords = ["database", "django", "performance", "queries"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["Django>=5.2,<6.2"]

[project.urls]
Homepage = "https://github.com/Atiqumer/django-querywatch"
Repository = "https://github.com/Atiqumer/django-querywatch"
Issues = "https://github.com/Atiqumer/django-querywatch/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/querywatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
